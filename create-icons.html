<!DOCTYPE html>
<html>
<head>
<title>PWA Icon Generator</title>
</head>
<body>
<h1>PWA 아이콘 생성기</h1>
<p>아래 캔버스를 클릭하면 아이콘 파일이 다운로드됩니다.</p>
<canvas id="canvas192" width="192" height="192" style="border: 1px solid #ccc; cursor: pointer; margin: 10px;"></canvas>
<button onclick="downloadIcon(192)">192x192 다운로드</button>
<br>
<canvas id="canvas512" width="512" height="512" style="border: 1px solid #ccc; cursor: pointer; margin: 10px;"></canvas>
<button onclick="downloadIcon(512)">512x512 다운로드</button>

<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const radius = size * 0.208; // 40/192 비율
  
  // 배경 (둥근 모서리)
  ctx.fillStyle = '#007aff';
  ctx.beginPath();
  ctx.moveTo(radius, 0);
  ctx.lineTo(size - radius, 0);
  ctx.quadraticCurveTo(size, 0, size, radius);
  ctx.lineTo(size, size - radius);
  ctx.quadraticCurveTo(size, size, size - radius, size);
  ctx.lineTo(radius, size);
  ctx.quadraticCurveTo(0, size, 0, size - radius);
  ctx.lineTo(0, radius);
  ctx.quadraticCurveTo(0, 0, radius, 0);
  ctx.closePath();
  ctx.fill();
  
  // 체크마크 (흰색)
  ctx.strokeStyle = 'white';
  ctx.lineWidth = size * 0.104; // 20/192 비율
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(size * 0.25, size * 0.5);
  ctx.lineTo(size * 0.417, size * 0.667);
  ctx.lineTo(size * 0.75, size * 0.333);
  ctx.stroke();
}

function downloadIcon(size) {
  const canvas = document.getElementById(`canvas${size}`);
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `icon-${size}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 'image/png');
}

// 아이콘 그리기
drawIcon(document.getElementById('canvas192'), 192);
drawIcon(document.getElementById('canvas512'), 512);
</script>
</body>
</html>
